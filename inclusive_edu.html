uted);font-size:.8rem}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:4rem;align-items:center}.card,.box,.video,.case{background:var(--paper);border:1px solid var(--line);padding:1.5rem;box-shadow:var(--shadow)}.card h3{font-size:1.25rem;margin-bottom:.5rem}.card p,.box p,.case p,.video p{color:var(--muted)}.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.objectives{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1rem,2.5vw,2rem);align-items:stretch}.objective{background:var(--paper);border:1px solid var(--line);padding:clamp(1.5rem,3vw,2.25rem);min-height:230px;display:flex;flex-direction:column;box-shadow:var(--shadow)}.objective-index{display:block;font-family:'Noto Serif TC',serif;font-size:clamp(2rem,3vw,3.25rem);line-height:1;color:var(--green);margin-bottom:auto}.objective h3{font-size:clamp(1.25rem,1.3vw,1.55rem);margin:1.4rem 0 .5rem}.objective p{color:var(--muted);font-size:.95rem}.bullets{display:grid;gap:.8rem;list-style:none}.bullets li{background:var(--paper);border:1px solid var(--line);padding:1rem 1.2rem}.sg{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.box{box-shadow:none}.box h3{color:var(--green);font-size:1rem;margin-bottom:.5rem}.box p{font-size:.92rem}.warn{background:var(--warn)}.example{background:var(--example)}.prompt{margin-top:1rem;background:var(--soft);padding:1rem 1.25rem;font-weight:600}.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;counter-reset:n}.four div{background:var(--paper);border:1px solid var(--line);padding:1.25rem}.four div:before{counter-increment:n;content:counter(n);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;margin-bottom:.75rem}.quote{font-family:'Noto Serif TC',serif;font-size:clamp(1.55rem,2.8vw,3rem);max-width:30ch;text-align:center;margin:auto}.eco{display:grid;grid-template-columns:minmax(320px,560px) 1fr;gap:4rem;align-items:center}.rings{position:relative;width:min(100%,560px);height:auto;aspect-ratio:1/1;justify-self:center}.ring{position:absolute;border-radius:50%;aspect-ratio:1/1;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));display:grid;place-items:start center;padding-top:.75rem;font-weight:700;color:var(--green);font-size:.9rem}.macro{inset:0;background:color-mix(in srgb,var(--green) 7%,var(--paper))}.exo{inset:12%;background:color-mix(in srgb,var(--green) 10%,var(--paper))}.meso{inset:25%;background:color-mix(in srgb,var(--green) 14%,var(--paper))}.micro{inset:39%;background:var(--green);color:#fff;place-items:center;text-align:center;padding:.5rem}.actions{display:flex;gap:.75rem;margin-top:1rem}.primary{background:var(--green);color:#fff;border-color:var(--green)}dialog{border:0;background:transparent;color:var(--ink);max-width:min(960px,94vw);width:100%}dialog::backdrop{background:rgba(0,0,0,.78)}.modal{background:var(--paper);padding:1rem}.modalhead{display:flex;justify-content:space-between;margin-bottom:.75rem}.player{aspect-ratio:16/9;background:#111}.player iframe{width:100%;height:100%;border:0}.overview{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem}.overview a{background:var(--paper);border:1px solid var(--line);padding:.7rem;text-decoration:none;font-size:.75rem}@media(max-width:900px){.hero,.eco{grid-template-columns:1fr}.cards3,.objectives{grid-template-columns:1fr}.objective{min-height:0}.objective-index{margin-bottom:.5rem}.sg{grid-template-columns:1fr}.four{grid-template-columns:1fr 1fr}.rings{width:min(76vw,500px)}}@media(max-width:600px){html{scroll-snap-type:none}.slide{min-height:auto;padding:82px 1rem 54px}.slide:first-child{min-height:100svh}.four{grid-template-columns:1fr}.rings{width:min(88vw,430px)}.ctrl.nav,.ctrl.overviewbtn{display:none}.overview{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><div class="brand">融合教育．第四章</div><div class="controls"><button class="ctrl overviewbtn" id="ob">總覽 52</button><button class="ctrl nav" id="prev">←</button><span class="count" id="count">01 / 52</span><button class="ctrl nav" id="next">→</button><button class="ctrl" id="theme">◐</button></div></header><div class="progress" id="progress"></div><main id="deck"></main><dialog id="modal"><div class="modal"><div class="modalhead"><b>案例影音</b><button class="btn" id="close">關閉</button></div><div class="player" id="player"></div></div></dialog><dialog id="overview"><div class="modal"><div class="modalhead"><b>全課程總覽</b><button class="btn" id="oclose">關閉</button></div><div class="overview" id="olist"></div></div></dialog><script>
const slides=[{"title": "融合教育的實施", "label": "國立臺東大學｜融合教育", "type": "hero", "content": "從基本理念、18項實施策略到生態系統：讓每一位學生參與、學習並擁有歸屬感。"}, {"title": "換個角度看挑戰", "label": "第四章｜融合教育的實施", "type": "quote", "content": "只有遭受阻撓的溪流，才會譜出潺潺的樂章；每個教學挑戰，也可能意味著另一個新的學習。"}, {"title": "本章學習目標", "label": "第四章｜融合教育的實施", "type": "objectives", "items": [["辨識理念", "說明融合教育對學生、學習、課程教學與評量的基本觀點。"], ["選擇策略", "依學生與環境的互動需求，組合適切的實施策略。"], ["系統思考", "從微視、居間、外圍與鉅視體系分析責任與支持。"]]}, {"title": "從安置走向參與", "label": "第四章｜融合教育的實施", "type": "three", "items": [["進得來", "空間、資訊、課程和溝通方式是否可近。"], ["學得到", "教學與評量是否回應差異，必要支持是否到位。"], ["屬於這裡", "學生是否有關係、決定權及被尊重的班級身分。"]]}, {"title": "本章架構", "label": "第四章｜融合教育的實施", "type": "three", "items": [["第一節", "實施融合教育的基本理念"], ["第二節", "18項實施策略"], ["第三節", "生態的融合教育實施模式"]]}, {"title": "對學生的觀點", "label": "第一節｜基本理念", "type": "bullets", "items": ["所有學生都能學習與成功，只是成功的表現方式不同。", "從寬廣、多元與全人的角度看待學生能力。", "學生在學習方式與表達理解的方式上有所不同。", "個別差異不是麻煩，而是可豐富教學的資源。"]}, {"title": "對學習的觀點", "label": "第一節｜基本理念", "type": "bullets", "items": ["學習不只是課業，也包括做人、做事與人共處。", "學習包括態度、方法與自我調整。", "學習內容應與學生生活產生意義連結。"]}, {"title": "對課程與教學的觀點（一）", "label": "第一節｜基本理念", "type": "bullets", "items": ["普通教育、特殊教育、相關專業、行政與家長共同承擔。", "師生都是主動參與者，彼此學習並共同解決問題。", "主動促進同儕互動與合作學習。", "讓不同能力的學生共同學習。", "教學回應不同程度的學生。", "課程安排考量能力、需求與興趣。"]}, {"title": "對課程與教學的觀點（二）", "label": "第一節｜基本理念", "type": "bullets", "items": ["學生可以用不同速度學習。", "所有學生都參與活動，但方式與層次可不同。", "教材服務有意義的學習目標。", "重視理解、保留與應用，而不只記憶與趕進度。", "兼顧外顯課程與潛在課程。", "特殊教育是一種服務，不是安置地點。"]}, {"title": "對評量的觀點", "label": "第一節｜基本理念", "type": "three", "items": [["多元證據", "從作品、實作、口語、觀察與歷程理解成就。"], ["適切標準", "依學習目標與個別需求評量，鼓勵與自己比較。"], ["共同成功", "學生達成個人與團體目標；系統回應每位學生。"]]}, {"title": "理念檢核：是融合還是只是同處？", "label": "第一節｜概念應用", "type": "case", "content": "學生坐在普通班最後一排，由助理員另做簡單作業；分組活動時留在座位，評量時直接免考。", "question": "他進得來、學得到、屬於這裡嗎？環境中有哪些可改變之處？"}, {"title": "18項策略：不是清單，是決策工具", "label": "第二節｜實施策略", "type": "three", "items": [["環境與關係", "生態評量、同儕、欣賞差異、賦權、無障礙。"], ["支持與合作", "支持服務、正向行為支持、合作小組。"], ["課程與教學", "學習策略、鷹架、UDL、調整與多元評量。"]]}, {"title": "1. 運用生態評量", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "不只問「學生會不會」，而是分析學生在不同活動、人物、時間、空間與要求下的參與。需求來自學生特性與環境要求之間的適配程度。", "do": "觀察不同時段與情境；訪談學生、家長與教師；分析活動要求、環境線索及行為結果；找出優勢與自然支持。", "mis": "只做能力測驗便下結論；只觀察一次就視為固定能力；把環境障礙改寫成學生缺陷。", "example": "學生在全班口頭報告時沉默，但在小組、事先取得題目並可搭配圖卡時，能完整表達。", "question": "你會蒐集哪些「學生 × 活動 × 環境」資料？"}, {"title": "2. 採用同儕關係與協助策略", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "同儕支持不是固定安排一位「小老師」代替教師，而是設計互惠、輪替且有共同目標的合作關係。", "do": "教導邀請、等待與提示；安排角色輪替；依興趣與自然關係配對；保留被協助者的決定權。", "mis": "長期單向照顧；協助變成控制或代做；只追求完成，忽略友誼與歸屬。", "example": "體育活動輪流擔任示範者、記錄者、鼓勵者與器材管理者。", "question": "如何讓協助是互惠，而不是慈善？"}, {"title": "3. 歡迎、欣賞所有學生", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "從容許差異存在，進一步讓每位學生的身分、文化、溝通方式與優勢成為課堂資源。", "do": "正確使用姓名與偏好；教材呈現多元身分；以尊重語言談差異；建立反排除規範。", "mis": "只在特殊節日談多元；用勵志敘事物化障礙者；口頭歡迎但活動持續排除。", "example": "讓學生依優勢選擇資料整理、視覺設計、口語說明或操作示範等角色。", "question": "學生如何從日常細節感受到「我屬於這裡」？"}, {"title": "4. 賦權學生", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "學生不只是接受成人安排的服務者，而要能理解選項、表達偏好、參與目標設定並評估支持。", "do": "提供可理解的選項；教自我倡議；讓學生參與會議；支持學生說不與修改決定。", "mis": "只問偏好卻不採納；選項都由成人決定；把不配合視為沒有決定能力。", "example": "考試調整前共同試用安靜空間、分段作答或語音輸入，再由學生判斷效果。", "question": "哪一項課堂決定可以交還給學生？"}, {"title": "5. 建立安全、無障礙且美觀的環境", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "以全方位設計事前降低物理、感官、資訊、認知與心理障礙，不等失敗後才補救。", "do": "確保動線與設備可近；資訊結構清楚；降低干擾；建立可預期且不羞辱的氛圍。", "mis": "把無障礙限縮為斜坡；過度簡化而降低挑戰；支持工具造成標記。", "example": "所有學生都可使用視覺流程、字幕、彈性座位與安靜角落。", "question": "你的教室有哪些看不見的障礙？"}, {"title": "6. 提供支持服務", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "支持應隨學生進入自然學習情境，並協助普通教育教師建立能力，而非抽離後就視為完成。", "do": "共同評估與訂目標；在課程中嵌入支持；提供輔具、溝通與人力資源；檢視參與效果。", "mis": "專業各做各的；支持只在抽離時段；助理員與學生形成一對一隔離。", "example": "語言治療師與導師共同設計討論句型卡，在真實課堂使用。", "question": "支持如何增加參與，而不是製造新隔離？"}, {"title": "7. 正向行為支持", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "將行為視為個體與環境互動下具有功能的訊息，調整前因、教替代技能並用資料檢核。", "do": "界定可觀察行為；記錄前因—行為—結果；推測並驗證功能；教等值替代行為。", "mis": "只用獎懲壓制；沒有功能評量就套方案；忽略課程、溝通與感官需求。", "example": "學生在抄寫時離座，先檢查負荷與求助方式，再教分段完成與休息卡。", "question": "行為正在替學生傳達什麼需求？"}, {"title": "8. 教導學習行為和策略", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "把計畫、監控、修正、記憶、組織與求助等歷程明確教出來，而非只要求學生更專心。", "do": "示範思考歷程；提供檢核表與範例；安排引導練習；逐步撤除提示。", "mis": "策略與學科內容分開；一次教太多；提供工具卻未示範使用。", "example": "閱讀前預測，閱讀中自問理解，閱讀後以概念圖檢查。", "question": "如何把「會學習」拆成可教步驟？"}, {"title": "9. 依學生的智力傾向設計課程與教學", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "從多元能力與優勢尋找學習入口，但不把學生固定貼上某種智力類型標籤。", "do": "盤點興趣與優勢；多媒介建構概念；提供有價值角色；維持共同且具挑戰的目標。", "mis": "把偏好當固定類型；因優勢不同降低目標；每堂課硬湊所有類型。", "example": "生態系可用實地觀察、圖表、辯論與模型建構理解同一核心概念。", "question": "如何運用優勢作為入口，又不限制學生？"}, {"title": "10. 針對學習困難提供鷹架", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "鷹架是針對當下障礙的暫時支持，需隨能力提升逐步減少，目標是增加獨立性。", "do": "定位困難步驟；選擇口語、視覺、材料或任務鷹架；示範與引導；規劃撤除。", "mis": "支持過多取代思考；永久保留提示；鷹架與目標無關。", "example": "寫作先給段落框架，掌握結構後逐步移除提示，最後只保留檢核表。", "question": "這個支持何時撤除？證據是什麼？"}, {"title": "11. 配合學生的學習風格進行教學", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "尊重當下偏好、經驗與情境差異，提供多元參與途徑；不宜固定分類為視覺型或聽覺型。", "do": "蒐集偏好但保持彈性；依目標選媒介；發展不熟悉方式；反思何時有效。", "mis": "用風格標籤限制教學；只配合單一偏好；把舒適等同最佳學習。", "example": "詞彙學習結合圖像、口語、動作與實際使用，讓學生比較效果。", "question": "偏好、能力與有效學習方式有何不同？"}, {"title": "12. 安排真實學習", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "把知識技能放進具有真實目的、真實對象與生活意義的任務，促進整合、應用與反思。", "do": "任務有真實使用者；容許多種解法；提供多元角色；評量過程、成果與遷移。", "mis": "只有華麗情境仍是填答案；任務太複雜掩蓋目標；生活化等同降低深度。", "example": "調查校園無障礙設施、整理數據，提出改善優先順序並向行政簡報。", "question": "這項成果會被誰使用？"}, {"title": "13. 因應需求調整課程與教學", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "先釐清共同核心目標，再調整內容、歷程、環境、時間、材料、反應方式或支持強度。", "do": "目標與障礙分開分析；選擇最小但足夠的調整；保留共同課程；追蹤成效。", "mis": "看標籤就套調整；把減量當唯一方法；調整後未追蹤。", "example": "若目標是理解因果，可用語音輸入；若目標是手寫，語音輸入可能改變評量構念。", "question": "調整改變的是障礙，還是核心目標？"}, {"title": "14. 運用全方位設計發展課程", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "在規劃之初提供多元參與、多元表徵及多元行動與表達，使所有學習者接近有意義且具挑戰的學習。", "do": "設計多元參與、表徵、行動與表達；先辨識障礙；讓選項服務共同目標。", "mis": "把UDL當降低難度；選項過多造成負荷；只有多媒體而無參與與表達。", "example": "共同目標是論證；學生可用文字、語音與圖示理解資料，再用多種方式提出證據。", "question": "哪些選項服務同一目標？"}, {"title": "15. 採取有效的教學行為與技巧", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "融合教育仍需要清楚、系統且高品質的教學：目標、示範、引導練習、檢核、回饋與複習。", "do": "讓目標可見；小步驟示範並說出思考；讓每人回應；依形成性資料調整。", "mis": "講完等於學會；只問懂了嗎；回饋只有對錯。", "example": "學生用白板同步作答，教師立即辨識誤概念並重新示範。", "question": "如何知道每位學生正在學？"}, {"title": "16. 實施真實而多元的評量", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "以與目標一致的多元證據判斷理解與應用，並容許不影響評量構念的彈性表達方式。", "do": "界定評量能力；蒐集作品、實作、觀察與口語證據；提供規準；讓結果回饋教學。", "mis": "多元等同每人完全不同；只看成品；表達困難掩蓋能力。", "example": "解釋水循環可用模型加口述、圖文或影片；共同規準仍一致。", "question": "彈性表達如何兼顧公平？"}, {"title": "17. 形成學生個人中心的計畫", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "從學生優勢、偏好、重要關係、生活願景與本人認定的優先事項出發，再整合專業支持。", "do": "用學生可理解方式開會；先談想要的生活；邀請重要他人；設定責任人與檢核時間。", "mis": "專業替學生定義好生活；會議充滿術語；只有缺陷沒有願景。", "example": "轉銜會議先由學生介紹擅長什麼、想去哪裡、希望如何被支持。", "question": "哪些內容真正由學生決定？"}, {"title": "18. 教學人員形成合作小組", "label": "第二節｜18項實施策略", "type": "strategy", "meaning": "合作不是切開工作各自完成，而是共同設定目標、規劃、教學、觀察、評量並承擔結果。", "do": "固定共同備課；明確且彈性分工；共享資料；讓學生、家長與專業參與。", "mis": "普通班教師教全班、特教只顧特生；助理員成唯一了解者；危機才開會。", "example": "團隊共同探究如何提高分組主動參與，一週後用資料檢討。", "question": "合作成果如何反映在學生參與？"}, {"title": "策略整合：從困難到支持方案", "label": "第二節｜策略決策", "type": "four", "items": ["描述可觀察的參與困難", "分析任務、人際、感官與制度障礙", "組合普遍設計與必要個別支持", "蒐集資料後維持、修改或撤除"]}, {"title": "小組任務：設計三項支持", "label": "第二節｜策略應用", "type": "case", "content": "分組探究課中，小恩很少發言，同儕常替他回答；教師認為他缺乏動機。", "question": "蒐集哪些資料？選哪三項策略？如何判斷支持有效？"}, {"title": "策略之間如何互相支撐？", "label": "第二節｜策略統整", "type": "three", "items": [["先理解", "生態評量＋學生聲音"], ["先移除再支持", "UDL＋無障礙＋鷹架"], ["確保持續", "合作小組＋多元評量＋資料檢核"]]}, {"title": "計畫是實施融合教育的準備", "label": "第三節｜整合模式", "type": "quote", "content": "不是等學生「準備好了」才能融合；而是透過計畫，讓環境、教學與支持先準備好。"}, {"title": "生態的融合教育實施模式", "label": "第三節｜生態模式", "type": "diagram"}, {"title": "微視體系：直接參與的場域", "label": "第三節｜生態模式", "type": "bullets", "items": ["融合班級：教師、同儕及家長。", "學校：特教教師、行政與相關人員。", "家庭：家人與日常生活關係。", "觀察學生參與、重要他人的期待，以及環境是否提供線索、選擇與支持。"]}, {"title": "居間體系：關係之間的關係", "label": "第三節｜生態模式", "type": "bullets", "items": ["教師—家長", "學校—家庭與社區", "普通教育—特殊教育—相關專業", "資訊、目標與責任是否真正共享？"]}, {"title": "外圍體系：未直接在場，仍深刻影響", "label": "第三節｜生態模式", "type": "three", "items": [["教育主管機關", "政策、資源配置與支持系統。"], ["師資培育單位", "教師信念、合作能力與實務準備。"], ["教材出版系統", "內容可近性與教師調整空間。"]]}, {"title": "鉅視體系：制度、文化、價值與信念", "label": "第三節｜生態模式", "type": "bullets", "items": ["社會如何理解障礙與差異？", "是否把同樣對待等同公平？", "競爭文化是否壓縮多元參與？", "政策語言與媒體敘事如何影響期待？"]}, {"title": "生態分析：問題在哪一層？", "label": "第三節｜生態模式", "type": "three", "items": [["微視與居間", "角色與溝通排除；目標與資訊不一致。"], ["外圍與鉅視", "資源流程限制；把差異視為缺陷。"], ["跨層決策", "從可改變處開始，同時向系統提出需求。"]]}, {"title": "證據連結：UDL 3.0", "label": "證據連結", "type": "three", "items": [["多元參與", "支持興趣、持續投入與情緒能力。"], ["多元表徵", "支持知覺、語言與知識建構。"], ["多元行動與表達", "支持互動、溝通與策略發展。"]]}, {"title": "證據連結：多層級正向支持", "label": "證據連結", "type": "three", "items": [["普遍支持", "為所有學生建立清楚期待與主動教導。"], ["目標性支持", "增加教學、練習與進度監測。"], ["密集個別化", "依正式評量與功能設計高強度支持。"]]}, {"title": "證據連結：鷹架如何促進獨立", "label": "證據連結", "type": "four", "items": ["精確找出障礙", "選擇口語、視覺、材料或任務鷹架", "安排示範、引導與回饋", "依資料逐步撤除並檢查遷移"]}, {"title": "證據如何回到18項策略？", "label": "證據連結", "type": "three", "items": [["UDL與PBIS", "事前移除障礙；整合系統、實務與資料。"], ["鷹架與能動性", "支持獨立；連結賦權及個人中心。"], ["合作與資料", "讓支持一致並檢查真實參與。"]]}, {"title": "案例影音：制度如何造成障礙", "label": "案例影音", "type": "video", "id": "kEyjlqixq9c", "meta": "UNESCO GEM Report｜2:50"}, {"title": "案例影音：傾聽學生聲音", "label": "案例影音", "type": "video", "id": "SE_rgSLLbVo", "meta": "UNICEF｜2:24"}, {"title": "案例影音：共同教學", "label": "案例影音", "type": "video", "id": "B71CLOHabq0", "meta": "Edutopia｜5:19"}, {"title": "案例影音：臺灣融合教育現場", "label": "案例影音", "type": "video", "id": "OYmYTOflyPk", "meta": "公視兒少教育資源網｜14:41"}, {"title": "綜合案例：建立支持方案", "label": "整合應用", "type": "case", "content": "自然課要求閱讀長篇材料、口頭討論並完成海報。亞哲閱讀慢、容易錯過口頭指令，分組時保持沉默，同儕逐漸不邀請他。", "question": "用生態評量找障礙；選至少四項策略；指出微視、居間及外圍體系各自要做什麼。"}, {"title": "支持方案示例", "label": "整合應用", "type": "four", "items": ["比較不同情境與參與", "提供結構化多媒介材料", "教句型、等待與互惠角色", "用參與與學習資料共同檢核"]}, {"title": "本章回顧", "label": "總結", "type": "three", "items": [["看法", "差異是常態，問題不能只定位在學生。"], ["做法", "先移除障礙，再提供足夠且可撤除的支持。"], ["系統", "班級、家庭、學校、行政與社會共享責任。"]]}, {"title": "離場前思考", "label": "課程結束", "type": "case", "content": "如果明天只能改變一件事，你會改變哪一個環境要求、教學安排、互動方式或決策流程？", "question": "我要改變＿＿；預期看到的學生改變是＿＿；我用＿＿判斷是否有效。"}];
function renderBody(s){if(s.type==='hero')return `<div class="hero"><div><p class="lead">${s.content}</p></div><aside class="card"><h3>本章核心問題</h3><p>當學生遭遇困難時，我們要改變學生、改變教學，還是改變環境與制度？</p></aside></div>`;if(s.type==='quote')return `<blockquote class="quote">${s.content}</blockquote>`;if(s.type==='objectives')return `<div class="objectives">${s.items.map((x,i)=>`<article class="objective"><span class="objective-index">${String(i+1).padStart(2,'0')}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div>`;if(s.type==='three')return `<div class="cards3">${s.items.map(x=>`<article class="card"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div>`;if(s.type==='bullets')return `<ul class="bullets">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;if(s.type==='case')return `<div class="hero"><div class="case"><p class="lead">${s.content}</p></div><aside class="card"><h3>請思考</h3><p>${s.question}</p></aside></div>`;if(s.type==='strategy')return `<p class="lead">${s.meaning}</p><div class="sg" style="margin-top:1.5rem"><section class="box"><h3>可以怎麼做</h3><p>${s.do}</p></section><section class="box warn"><h3>常見誤區</h3><p>${s.mis}</p></section><section class="box example"><h3>課堂例子</h3><p>${s.example}</p></section><section class="box"><h3>判斷成效</h3><p>學生的接近、參與、學習、關係與自主是否改善，而不只看任務有沒有完成。</p></section></div><p class="prompt">討論：${s.question}</p>`;if(s.type==='four')return `<div class="four">${s.items.map(x=>`<div>${x}</div>`).join('')}</div>`;if(s.type==='diagram')return `<div class="eco"><div class="rings"><div class="ring macro">鉅視體系</div><div class="ring exo">外圍體系</div><div class="ring meso">居間體系</div><div class="ring micro">微視體系<br>融合現場</div></div><ul class="bullets"><li>生態體系與重要他人的觀點</li><li>個體與體系互動的品質</li><li>不同體系彼此互動的品質</li></ul></div>`;if(s.type==='video')return `<div class="video"><h3>${s.meta}</h3><p>播放前先找出影片中的參與障礙、支持策略與生態層次。</p><div class="actions"><button class="btn primary" data-video="${s.id}">網頁內播放</button><a class="btn" href="https://www.youtube.com/watch?v=${s.id}" target="_blank" rel="noopener">YouTube</a></div></div>`;return ''}

const nodes=[...document.querySelectorAll('.slide')];let cur=0;function update(){count.textContent=String(cur+1).padStart(2,'0')+' / 52';progress.style.width=(cur+1)/52*100+'%'}function go(n){cur=Math.max(0,Math.min(51,n));nodes[cur].scrollIntoView({behavior:'smooth'});update()}prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}});const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cur=nodes.indexOf(e.target);update()}}),{threshold:.55});nodes.forEach(n=>io.observe(n));let dark=matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';theme.onclick=()=>{dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light'};document.addEventListener('click',e=>{const b=e.target.closest('[data-video]');if(b){player.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.video}?autoplay=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`;modal.showModal()}});close.onclick=()=>modal.close();modal.onclose=()=>player.innerHTML='';olist.innerHTML=slides.map((s,i)=>`<a href="#s${i+1}" data-go>${String(i+1).padStart(2,'0')}<br>${s.title}</a>`).join('');ob.onclick=()=>overview.showModal();oclose.onclick=()=>overview.close();overview.onclick=e=>{if(e.target.closest('[data-go]'))overview.close()};
